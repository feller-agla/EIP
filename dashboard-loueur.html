<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord Loueur - EventBenin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar injected by app.js -->

    <div class="container" style="margin-top: 2rem;">
        <div class="dashboard-grid">
            
            <!-- Sidebar -->
            <aside class="dashboard-sidebar">
                <button class="btn btn-outline mobile-filter-toggle" id="dashboard-toggle" style="width: 100%; margin-bottom: 1rem;">
                    <i class="fas fa-bars"></i> Menu Dashboard
                </button>
                <nav id="dashboard-nav" class="sidebar-content">
                    <a href="#" class="dash-nav-item active"><i class="fas fa-home"></i> Vue d'ensemble</a>
                    <a href="#" class="dash-nav-item"><i class="fas fa-box"></i> Mes Produits</a>
                    <a href="#" class="dash-nav-item"><i class="fas fa-calendar-alt"></i> Réservations <span id="pending-count" style="background: var(--accent-color); color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.7rem; margin-left: auto; display: none;">0</span></a>
                    <a href="#" class="dash-nav-item"><i class="fas fa-chart-bar"></i> Statistiques</a>
                    <a href="#" class="dash-nav-item"><i class="fas fa-cog"></i> Paramètres</a>
                    <a href="#" onclick="Store.logout()" class="dash-nav-item" style="color: var(--accent-color); margin-top: 2rem;"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
                </nav>
            </aside>

            <!-- Main Content -->
            <main>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                     <h2 class="section-title" style="font-size: 1.5rem; margin: 0;">Vue d'ensemble</h2>
                     <button class="btn btn-sm btn-outline" onclick="renderDashboard()"><i class="fas fa-sync-alt"></i> Actualiser</button>
                </div>
                
                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-wallet"></i></div>
                        <div>
                            <div class="stat-value" id="stats-revenue">0</div>
                            <div class="stat-label">Revenus (FCFA)</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
                        <div>
                            <div class="stat-value" id="stats-res-count">0</div>
                            <div class="stat-label">Réservations</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-box-open"></i></div>
                        <div>
                            <div class="stat-value" id="stats-products">0</div>
                            <div class="stat-label">Produits en ligne</div>
                        </div>
                    </div>
                </div>

                <!-- Recent Orders -->
                <div style="background: white; border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 1.5rem;">
                    <h3 style="font-weight: 700; margin-bottom: 1rem;">Réservations Récentes</h3>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Client / Lieu</th>
                                    <th>Date Événement</th>
                                    <th>Montant</th>
                                    <th>Statut</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table">
                                <!-- Injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    <!-- Footer injected by app.js -->

    <script src="assets/js/data.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        // Inline Vendor Logic
        // Store.init() is called by App.init normally, but here we might need manual control or just let App do it.
        // App.js handles Header/Footer injection on load.

        document.addEventListener('DOMContentLoaded', () => {
            // Ensure App is ready or wait for it? 
            // App.init is also on DOMContentLoaded.
            
            const user = Store.getUser();
            if (!user || user.role !== 'vendor') {
                window.location.href = 'connexion.html';
                return;
            }

            // Mobile Dashboard Toggle
            const dashToggle = document.getElementById('dashboard-toggle');
            const dashNav = document.getElementById('dashboard-nav');
            if (dashToggle && dashNav) {
                dashToggle.addEventListener('click', () => {
                    const isHidden = dashNav.style.display === 'none' || dashNav.style.display === '';
                    dashNav.style.display = isHidden ? 'flex' : 'none';
                    dashNav.style.flexDirection = 'column';
                });
            }

            renderDashboard();
        });

        function renderDashboard() {
            const allOrders = JSON.parse(localStorage.getItem(Store.KEYS.ORDERS) || '[]');
            const products = Store.getAllProducts();

            // Calcs
            const totalRevenue = allOrders.reduce((acc, o) => acc + o.amount, 0);
            const totalRes = allOrders.length;

            document.getElementById('stats-revenue').textContent = Utils.formatCurrency(totalRevenue);
            document.getElementById('stats-res-count').textContent = totalRes;
            document.getElementById('stats-products').textContent = products.length;

            // Pending count
            const pending = allOrders.filter(o => o.status === 'En attente').length;
            const pendingBadge = document.getElementById('pending-count');
            if (pending > 0) {
                pendingBadge.textContent = pending;
                pendingBadge.style.display = 'inline-block';
            } else {
                pendingBadge.style.display = 'none';
            }

            // Table
            const tbody = document.getElementById('orders-table');
            if (allOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">Aucune commande pour le moment.</td></tr>';
                return;
            }

            tbody.innerHTML = allOrders.map(order => {
                const statusColor = 
                    order.status === 'En attente' ? 'background: #FEF3C7; color: #92400E;' :
                    order.status === 'Confirmé' ? 'background: #DEF7EC; color: #03543F;' :
                    'background: #F3F4F6; color: #1F2937;';

                const actionBtn = order.status === 'En attente' 
                    ? `<button class="btn btn-sm btn-primary" onclick="updateStatus('${order.id}', 'Confirmé')">Valider</button>`
                    : `<span style="color: var(--text-gray); font-size: 0.8rem;">Aucune action</span>`;

                return `
                    <tr>
                        <td><span style="font-family: monospace;">${order.id}</span></td>
                        <td>
                            <div style="font-weight: 600;">Client Démo</div>
                            <div style="font-size: 0.8rem; color: var(--text-gray);">${order.eventLocation}</div>
                        </td>
                        <td>${Utils.formatDate(order.eventDate)}</td>
                        <td style="font-weight: 700;">${Utils.formatCurrency(order.amount)}</td>
                        <td><span style="${statusColor} padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;">${order.status}</span></td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
            }).join('');
        }

        window.updateStatus = (id, newStatus) => {
            if (confirm(`Voulez-vous vraiment passer cette commande à "${newStatus}" ?`)) {
                let orders = JSON.parse(localStorage.getItem(Store.KEYS.ORDERS) || '[]');
                const orderIndex = orders.findIndex(o => o.id === id);
                if (orderIndex !== -1) {
                    orders[orderIndex].status = newStatus;
                    localStorage.setItem(Store.KEYS.ORDERS, JSON.stringify(orders));
                    renderDashboard(); // Re-render
                    // Optional: Toast "Statut mis à jour" if we had App.showToast available here
                }
            }
        };
    </script>
</body>
</html>
