<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EventBenin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="height: 100vh; overflow: hidden; display: flex; align-items: stretch;">

    <!-- Left Side: Image / Brand -->
    <div class="auth-brand-side signup-bg">
        <div style="position: relative; z-index: 2; padding: 4rem;">
            <a href="index.html" class="logo" style="color: white; font-size: 2rem; margin-bottom: 2rem; display: block;">
                <i class="fas fa-layer-group"></i> EventBenin.
            </a>
            <h1 style="font-size: 3.5rem; line-height: 1.1; margin-bottom: 2rem;">Rejoignez l'élite<br>de l'événementiel.</h1>
            <p style="font-size: 1.2rem; opacity: 0.9; max-width: 500px;">Gérez vos locations ou trouvez le matériel parfait en quelques clics.</p>
        </div>
        <div class="overlay"></div>
    </div>

    <!-- Right Side: Form -->
    <div class="auth-form-side">
        <div style="width: 100%; max-width: 420px; animation: slideIn 0.6s ease-out;">
            <div style="margin-bottom: 3rem;">
                <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-dark);">Créer un compte</h2>
                <p style="color: var(--text-gray);">C'est gratuit et ça prend 1 minute.</p>
            </div>

            <form id="signup-form">
                <div class="form-floating mb-3">
                    <input type="text" class="form-input" id="name" placeholder=" " required>
                    <label for="name">Nom complet</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-input" id="email" placeholder=" " required>
                    <label for="email">Adresse Email</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-input" id="password" placeholder=" " required>
                    <label for="password">Mot de passe</label>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Je veux rejoindre en tant que :</label>
                    <div style="display: flex; gap: 1rem;">
                        <label class="role-selector selected">
                            <input type="radio" name="role" value="client" checked onchange="toggleRole(this)">
                            Client
                        </label>
                        <label class="role-selector">
                            <input type="radio" name="role" value="vendor" onchange="toggleRole(this)">
                            Loueur
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    Commencer <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
                </button>
            </form>

            <div style="margin-top: 3rem; text-align: center; color: var(--text-gray);">
                Déjà membre ? <a href="connexion.html" style="color: var(--primary-color); font-weight: 700;">Se connecter</a>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/store.js"></script>
    <script>
        Store.init();

        function toggleRole(radio) {
            document.querySelectorAll('.role-selector').forEach(el => el.classList.remove('selected'));
            radio.parentElement.classList.add('selected');
        }

        // Auto-select role from URL
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const role = params.get('role');
            if (role === 'vendor') {
                const vendorRadio = document.querySelector('input[value="vendor"]');
                if (vendorRadio) {
                    vendorRadio.checked = true;
                    toggleRole(vendorRadio);
                }
            }
        });
        
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            // Simple register simulation (Store doesn't strictly have a register method exposed but login essentially sets user)
            // Ideally we'd add it to Store logic, but for now we auto-login with these creds and role 
            // NOTE: Store.login checks 'users' array mock. We will just simulate success.
            
            // Hack for mock persistence:
            const user = { id: Utils.generateId(), name, email, role, avatar: '<div style="width:32px;height:32px;background:#ddd;border-radius:50%"></div>' };
            localStorage.setItem(Store.KEYS.USER, JSON.stringify(user));
             
            window.location.href = role === 'vendor' ? 'dashboard-loueur.html' : 'index.html';
        });
    </script>
</body>
</html>
