<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EventBenin Location</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-layer-group"></i> EventBenin<span style="color:var(--secondary-color)">.</span>
            </a>
            <a href="index.html" class="nav-link">Retour au site</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="text-center" style="margin-bottom: 2rem;">
            <h2 class="section-title" style="font-size: 1.8rem;">Créer un compte</h2>
            <p style="color: var(--text-gray);">Rejoignez la communauté EventBenin</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Compte créé !'); window.location.href='connexion.html';">
            <div class="form-group">
                <label class="form-label">Nom complet</label>
                <input type="text" class="form-control" placeholder="Jean Dupont" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="exemple@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label class="form-label">Vous êtes ?</label>
                <select class="form-control">
                    <option>Organisateur d'événement</option>
                    <option>Loueur de matériel</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">S'inscrire</button>
        </form>

        <div class="text-center" style="margin-top: 1.5rem; font-size: 0.9rem;">
            Déjà un compte ? <a href="connexion.html" style="color: var(--primary-color); font-weight: 600;">Se connecter</a>
        </div>
    </div>

</body>
</html>
