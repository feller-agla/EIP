<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EventBenin Location</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Basic Header -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-layer-group"></i> EventBenin<span style="color:var(--secondary-color)">.</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <div class="text-center" style="margin-bottom: 2rem;">
                <h2 style="font-size: 1.5rem; font-weight: 800;">Créer un compte</h2>
                <p style="color: var(--text-gray);">Rejoignez EventBenin dès aujourd'hui</p>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label">Nom complet</label>
                    <input type="text" class="form-control" placeholder="Jean Dupont" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="nom@exemple.com" required id="email">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" placeholder="••••••••" required id="password">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">S'inscrire</button>
            </form>

            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color); text-center;">
                <p style="font-size: 0.9rem;">Déjà un compte ? <a href="connexion.html" style="color: var(--primary-color); font-weight: 600;">Se connecter</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/store.js"></script>
    <script>
        Store.init();
        
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simuler inscription réussie
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Auto login
            Store.login(email, password);
             
            alert('Compte créé avec succès !');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
