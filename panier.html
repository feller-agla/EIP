<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - EventBenin Location</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-layer-group"></i> EventBenin<span style="color:var(--secondary-color)">.</span>
            </a>
            <div class="mobile-toggle">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Accueil</a></li>
                <li><a href="catalogue.html" class="nav-link">Catalogue</a></li>
                <li><a href="panier.html" class="nav-link" style="color: var(--primary-color);"><i class="fas fa-shopping-cart"></i> <span id="cart-count" style="background: var(--accent-color); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; display: none;">0</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="section">
        <div class="container">
            <h1 class="section-title">Votre Panier</h1>
            
            <div class="catalogue-layout" style="grid-template-columns: 1fr 350px;">
                <!-- Cart Items -->
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Produit</th>
                                <th>Durée</th>
                                <th>Prix</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items">
                            <!-- Items will be injected here by JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Summary -->
                <div class="sidebar">
                    <h3 class="filter-title">Récapitulatif</h3>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <span>Sous-total</span>
                        <span id="cart-total">0 FCFA</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <span>Frais de service (5%)</span>
                        <span>Calculé au paiement</span>
                    </div>
                    <div style="border-top: 1px solid var(--border-color); margin: 1rem 0;"></div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-weight: 700; font-size: 1.2rem;">
                        <span>Total</span>
                        <span id="cart-total-final">--</span>
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="alert('Redirection vers le paiement Mobile Money...')">Payer maintenant</button>
                    <p style="font-size: 0.8rem; color: var(--text-gray); margin-top: 1rem; text-align: center;">
                        <i class="fas fa-lock"></i> Paiement sécurisé par MTN/Moov
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="assets/js/script.js"></script>
</body>
</html>
