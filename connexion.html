<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - EventBenin Location</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Basic Header -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-layer-group"></i> EventBenin<span style="color:var(--secondary-color)">.</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <div class="text-center" style="margin-bottom: 2rem;">
                <h2 style="font-size: 1.5rem; font-weight: 800;">Bon retour parmi nous</h2>
                <p style="color: var(--text-gray);">Connectez-vous pour gérer vos locations</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" value="marie@example.com" placeholder="nom@exemple.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" value="password123" placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">Se Connecter</button>
                
                <div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem;">
                    <button type="button" class="btn btn-sm btn-outline" style="font-size: 0.8rem;" onclick="quickLogin('client')">Démo Client</button>
                    <button type="button" class="btn btn-sm btn-outline" style="font-size: 0.8rem;" onclick="quickLogin('vendor')">Démo Loueur</button>
                </div>

                <div class="text-center">
                    <a href="#" style="font-size: 0.9rem; color: var(--primary-color);">Mot de passe oublié ?</a>
                </div>
            </form>

            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color); text-center;">
                <p style="font-size: 0.9rem;">Pas encore de compte ? <a href="inscription.html" style="color: var(--primary-color); font-weight: 600;">Créer un compte</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/store.js"></script>
    <script>
        Store.init(); // Init store without full app
        
        function handleLogin(email, password) {
            if (Store.login(email, password)) {
                const user = Store.getUser();
                // Check redirect param
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                
                // Redirect based on role
                if (redirect) {
                    window.location.href = redirect + '.html';
                } else if (user.role === 'vendor') {
                    window.location.href = 'dashboard-loueur.html';
                } else {
                    window.location.href = 'dashboard-client.html';
                }
            } else {
                alert('Erreur de connexion');
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;
            handleLogin(email, password);
        });

        window.quickLogin = (role) => {
            if (role === 'client') handleLogin('marie@example.com', 'password123');
            if (role === 'vendor') handleLogin('vendor@eventbenin.bj', 'admin123');
        }
    </script>
</body>
</html>
